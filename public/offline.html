<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#059669" />
    <title>Offline | NECO</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #fff;
        background: linear-gradient(to right, #047857, #059669, #14b8a6);
      }
      img { width: 72px; height: 72px; object-fit: contain; margin-bottom: 16px; }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0 0 20px; font-size: 14px; color: #d1fae5; }
      button {
        padding: 10px 22px;
        border: 0;
        border-radius: 12px;
        background: #fff;
        color: #047857;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="" />
      <h1>Kamu sedang offline</h1>
      <p>Periksa koneksi internet, lalu coba lagi.</p>
      <button onclick="location.reload()">Muat Ulang</button>
    </main>
  </body>
</html>
